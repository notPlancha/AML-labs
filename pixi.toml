[workspace]
channels = ["https://prefix.dev/conda-forge"]
name = "aml-labs"
platforms = ["linux-64", "win-64"]

# [system-requirements]
# cuda = "12.0"

[tasks]
server = "jupyter server"
check-diff = "git diff upstream/develop~1 upstream/develop~2 > diff.patch"
apply-diff = "git apply diff.patch && rm diff.patch"

[dependencies]
python = ">=3.13.3,<3.14"
jupyter = ">=1.1.1,<2"
pytorch = ">=2.6.0,<3"
# pytorch-gpu = "*"
torchvision = ">=0.21.0,<0.22"


[environments]
nb-diff = ["nb-diff"]
gpu = ["gpu"]

[feature.nb-diff.dependencies]
nbdime = "*"

[feature.nb-diff.tasks]
setup-diff = "nbdime config-git --enable"

[feature.gpu.dependencies]
pytorch-gpu = "*"
